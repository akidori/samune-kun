<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>さむね君</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

:root {
  --bg: #f8faf8;
  --white: #fff;
  --hdr: #0f4c2a;
  --hdr2: #0a3d22;
  --green: #16a34a;
  --green-l: #22c55e;
  --green-xl: #4ade80;
  --green-bg: #f0fdf4;
  --green-bg2: #dcfce7;
  --border: #e2f0e6;
  --border2: #bbf7d0;
  --text: #0f172a;
  --text2: #374151;
  --muted: #6b7280;
  --muted2: #9ca3af;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); font-family: 'Noto Sans JP', sans-serif; color: var(--text); font-size: 12px; min-height: 100vh; }

/* ══ HEADER ══ */
.hdr {
  background: var(--hdr);
  height: 52px;
  padding: 0 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 300;
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
}
.hdr-logo { display: flex; align-items: center; gap: 8px; }
.hdr-icon { width: 28px; height: 28px; background: linear-gradient(135deg,var(--green-l),var(--green)); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 15px; }
.hdr-name { font-size: 14px; font-weight: 700; color: #fff; }
.hdr-sub { font-size: 9px; color: rgba(255,255,255,0.4); }
.hdr-sep { width: 1px; height: 22px; background: rgba(255,255,255,0.12); flex-shrink: 0; }
.hdr-spacer { flex: 1; }
.hdr-btn { height: 30px; padding: 0 12px; border-radius: 5px; border: none; font-size: 11px; font-weight: 700; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; display: flex; align-items: center; gap: 5px; transition: all 0.15s; flex-shrink: 0; }
.hdr-btn.green { background: var(--green-l); color: var(--hdr2); }
.hdr-btn.green:hover { background: var(--green-xl); }
.hdr-btn.ghost { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.85); }
.hdr-btn.ghost:hover { background: rgba(255,255,255,0.18); color: #fff; }

/* legend */
.legend { display: flex; gap: 8px; align-items: center; padding: 4px 10px; background: rgba(0,0,0,0.2); border-radius: 20px; }
.ldot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.litem { display: flex; align-items: center; gap: 4px; font-size: 10px; color: rgba(255,255,255,0.5); font-family: 'DM Mono', monospace; white-space: nowrap; }

/* ══ 案件タブバー ══ */
.case-tabbar {
  background: var(--white);
  border-bottom: 2px solid var(--border2);
  display: flex;
  align-items: stretch;
  overflow-x: auto;
  position: sticky;
  top: 52px;
  z-index: 200;
  padding: 0 12px;
}
.case-tabbar::-webkit-scrollbar { height: 3px; }
.case-tabbar::-webkit-scrollbar-thumb { background: var(--border2); }

.case-tab {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 0 14px;
  height: 40px;
  border: none;
  background: transparent;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  font-family: 'Noto Sans JP', sans-serif;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: all 0.15s;
  flex-shrink: 0;
}
.case-tab.active { color: var(--green); border-bottom-color: var(--green); font-weight: 700; }
.case-tab:hover:not(.active) { color: var(--text2); background: var(--green-bg); }

.case-tab-name {
  border: none; background: transparent;
  font-size: 12px; font-weight: inherit; color: inherit;
  font-family: 'Noto Sans JP', sans-serif;
  cursor: pointer; outline: none;
  min-width: 40px; max-width: 120px;
}
.case-tab-name:focus { background: rgba(22,163,74,0.08); border-radius: 3px; padding: 0 4px; }

.case-tab-del {
  width: 15px; height: 15px; background: none; border: none;
  color: var(--muted2); cursor: pointer; font-size: 11px;
  border-radius: 3px; transition: all 0.12s; padding: 0;
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
}
.case-tab:hover .case-tab-del { opacity: 1; }
.case-tab-del:hover { background: #fee2e2; color: #dc2626; }

.case-tab-add {
  display: flex; align-items: center; gap: 4px;
  padding: 0 12px; height: 40px;
  border: none; background: transparent;
  color: var(--muted2); font-size: 11px;
  cursor: pointer; font-family: 'Noto Sans JP', sans-serif;
  transition: color 0.12s; white-space: nowrap; flex-shrink: 0;
}
.case-tab-add:hover { color: var(--green); }

.case-tabbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 4px;
  flex-shrink: 0;
}
.tab-share-btn {
  height: 26px; padding: 0 10px;
  border: 1px solid var(--border2);
  border-radius: 5px; background: var(--green-bg);
  font-size: 10px; font-weight: 600; color: var(--green);
  cursor: pointer; font-family: 'Noto Sans JP', sans-serif;
  display: flex; align-items: center; gap: 4px;
  transition: all 0.12s; white-space: nowrap;
}
.tab-share-btn:hover { background: var(--green-bg2); }
.tab-add-row-btn {
  height: 26px; padding: 0 10px;
  border: none; border-radius: 5px;
  background: var(--green); color: #fff;
  font-size: 10px; font-weight: 700;
  cursor: pointer; font-family: 'Noto Sans JP', sans-serif;
  display: flex; align-items: center; gap: 3px;
  transition: background 0.12s; white-space: nowrap;
}
.tab-add-row-btn:hover { background: var(--green-l); }

/* ══ TABLE ══ */
.sheet-wrap { overflow-x: auto; }
table.sheet { border-collapse: collapse; width: 100%; min-width: 820px; table-layout: fixed; background: var(--white); }
table.sheet thead th { background: var(--hdr2); border-right: 1px solid rgba(255,255,255,0.06); border-bottom: 2px solid rgba(255,255,255,0.08); padding: 0; }
table.sheet thead th:last-child { border-right: none; }
.th-in { padding: 8px 10px; font-family: 'DM Mono', monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.3); display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.th-in.plan-h { color: var(--green-xl); }
.th-badge { display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; background: rgba(255,255,255,0.08); border-radius: 3px; font-size: 9px; color: rgba(255,255,255,0.3); }
table.sheet tbody tr { border-bottom: 1px solid var(--border); }
table.sheet tbody tr:last-child { border-bottom: none; }
table.sheet tbody tr:hover td { background: #f6fef8; }
table.sheet tbody tr:hover td.plan-td { background: #e8faf0; }
td.rn { width: 36px; text-align: center; font-family: 'DM Mono', monospace; font-size: 10px; color: var(--green-l); background: var(--green-bg); border-right: 1px solid var(--border2); vertical-align: top; padding-top: 14px; user-select: none; }
td.plan-td { width: 18%; background: var(--green-bg); border-right: 2px solid var(--border2); vertical-align: top; padding: 10px 12px; position: relative; min-width: 180px; }
.plan-ta { width: 100%; background: transparent; border: none; outline: none; font-size: 12px; font-weight: 600; color: var(--hdr2); font-family: 'Noto Sans JP', sans-serif; resize: none; line-height: 1.65; min-height: 56px; padding: 4px 6px; border-radius: 4px; transition: background 0.15s; }
.plan-ta:focus { background: rgba(22,163,74,0.06); }
.plan-ta::placeholder { color: var(--border2); font-weight: 300; font-size: 11px; }
.plan-actions { display: flex; align-items: center; gap: 6px; margin-top: 6px; opacity: 0; transition: opacity 0.15s; }
table.sheet tbody tr:hover .plan-actions { opacity: 1; }
.del-row-btn { width: 20px; height: 20px; background: none; border: none; color: var(--muted2); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 3px; font-size: 12px; transition: all 0.12s; margin-left: auto; }
.del-row-btn:hover { background: #fee2e2; color: #dc2626; }
td.ref-td { border-right: 1px solid var(--border); background: var(--white); vertical-align: top; padding: 10px; }
td.ref-td:last-child { border-right: none; padding-right: 20px; }
.url-row { display: flex; gap: 4px; margin-bottom: 8px; }
.url-in { flex: 1; min-width: 0; background: var(--green-bg); border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; font-size: 9px; color: var(--text); font-family: 'DM Mono', monospace; outline: none; transition: all 0.15s; }
.url-in:focus { border-color: var(--green); background: #fff; }
.url-in::placeholder { color: var(--muted2); font-family: 'Noto Sans JP', sans-serif; font-size: 9px; }
.go-btn { width: 24px; height: 24px; background: var(--green); border: none; border-radius: 4px; cursor: pointer; color: #fff; font-size: 11px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: background 0.15s; }
.go-btn:hover { background: var(--green-l); }
.score-badge { display: inline-flex; align-items: center; gap: 4px; border-radius: 4px; padding: 3px 8px; font-family: 'DM Mono', monospace; font-size: 10px; font-weight: 600; margin-bottom: 6px; border: 1px solid transparent; }
.score-badge.S { color: #15803d; background: #f0fdf4; border-color: #86efac; }
.score-badge.A { color: #16a34a; background: #f0fdf4; border-color: #bbf7d0; }
.score-badge.B { color: #2563eb; background: #eff6ff; border-color: #93c5fd; }
.score-badge.C { color: #d97706; background: #fffbeb; border-color: #fcd34d; }
.score-badge.X { color: #dc2626; background: #fef2f2; border-color: #fca5a5; }
.score-bar-wrap { height: 2px; background: var(--border); border-radius: 1px; margin-bottom: 8px; overflow: hidden; }
.score-bar { height: 100%; border-radius: 1px; transition: width 0.5s; }
.score-bar.S,.score-bar.A { background: var(--green); }
.score-bar.B { background: #3b82f6; }
.score-bar.C { background: #f59e0b; }
.score-bar.X { background: #ef4444; }
.thumb-link { display: block; position: relative; width: 100%; aspect-ratio: 16/9; border-radius: 5px; overflow: hidden; background: var(--green-bg2); margin-bottom: 7px; text-decoration: none; }
.thumb-link:hover .thumb-ov { opacity: 1; }
.thumb-link img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb-ov { position: absolute; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s; }
.thumb-play { width: 34px; height: 34px; background: rgba(255,255,255,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.thumb-play::after { content: ''; border-style: solid; border-width: 6px 0 6px 12px; border-color: transparent transparent transparent #000; margin-left: 3px; }
.thumb-dur { position: absolute; bottom: 4px; right: 4px; background: rgba(0,0,0,0.8); color: #fff; font-family: 'DM Mono', monospace; font-size: 9px; padding: 1px 4px; border-radius: 2px; }
.v-ch { font-size: 9px; color: var(--muted); font-family: 'DM Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
.v-title { font-size: 11px; font-weight: 500; line-height: 1.45; color: var(--text2); margin-bottom: 7px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.v-stats { display: flex; flex-direction: column; gap: 3px; }
.v-stat { display: flex; align-items: center; gap: 5px; font-family: 'DM Mono', monospace; font-size: 9px; }
.v-stat-icon { color: var(--green-l); width: 10px; }
.v-stat-val { color: var(--text); font-weight: 500; }
.v-stat-sub { color: var(--muted2); }
.v-ratio { font-family: 'DM Mono', monospace; font-size: 9px; margin-top: 5px; padding: 3px 7px; border-radius: 3px; display: inline-block; font-weight: 600; }
.v-ratio.great { background: #f0fdf4; color: #15803d; }
.v-ratio.ok { background: #dbeafe; color: #1d4ed8; }
.v-ratio.low { background: #fef2f2; color: #dc2626; }
.skel { animation: shimmer 1.1s linear infinite; background: linear-gradient(90deg,var(--green-bg2) 25%,#f0fdf4 50%,var(--green-bg2) 75%); background-size: 200% 100%; border-radius: 4px; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.skel-thumb { width:100%; aspect-ratio:16/9; border-radius:5px; margin-bottom:7px; }
.skel-line { height:9px; margin-bottom:4px; }
.vc { display: none; }
.vc.loaded { display: block; animation: fadeUp 0.2s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }
.err-box { font-size: 10px; color: #dc2626; background: #fef2f2; padding: 6px 8px; border-radius: 4px; display: none; line-height: 1.5; }
.err-box.show { display: block; }
.clear-lnk { font-size: 9px; color: var(--muted2); background: none; border: none; cursor: pointer; text-decoration: underline; font-family: 'Noto Sans JP', sans-serif; margin-top: 5px; display: none; padding: 0; }
.clear-lnk.show { display: block; }

/* ══ 共有モード ══ */
.readonly-bar { background: linear-gradient(135deg,#064e2e,#0f4c2a); padding: 12px 20px; display: none; align-items: center; gap: 12px; }
.readonly-bar.visible { display: flex; }
.readonly-title { font-size: 15px; font-weight: 700; color: #fff; }
.readonly-sub { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 2px; }
.readonly-badge { margin-left: auto; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 3px 10px; font-size: 9px; color: rgba(255,255,255,0.6); font-family: 'DM Mono', monospace; }

/* ══ MODAL ══ */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 500; display: none; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
.modal-bg.open { display: flex; }
.modal { background: #fff; border-radius: 12px; padding: 22px; width: 420px; max-width: 90vw; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
.modal-title { font-size: 14px; font-weight: 700; color: var(--hdr2); margin-bottom: 5px; }
.modal-sub { font-size: 11px; color: var(--muted); margin-bottom: 14px; }
.modal-url-wrap { position: relative; margin-bottom: 10px; }
.modal-url { width: 100%; background: var(--green-bg); border: 1px solid var(--border2); border-radius: 5px; padding: 8px 80px 8px 10px; font-size: 10px; font-family: 'DM Mono', monospace; color: var(--text); outline: none; }
.modal-copy { position: absolute; right: 5px; top: 50%; transform: translateY(-50%); background: var(--green); border: none; border-radius: 4px; padding: 4px 10px; font-size: 10px; font-weight: 700; color: #fff; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: background 0.15s; }
.modal-copy:hover { background: var(--green-l); }
.modal-copy.copied { background: #059669; }
.modal-note { font-size: 10px; color: var(--muted2); line-height: 1.6; background: #f9fafb; border-radius: 5px; padding: 8px 10px; margin-bottom: 12px; }
.modal-close { width: 100%; padding: 8px; background: var(--green-bg2); border: 1px solid var(--border2); border-radius: 5px; color: var(--green); font-size: 11px; font-weight: 600; cursor: pointer; font-family: 'Noto Sans JP', sans-serif; transition: background 0.15s; }
.modal-close:hover { background: var(--border2); }

/* TOAST */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--hdr2); color: #fff; font-size: 12px; padding: 10px 20px; border-radius: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.2); z-index: 600; transition: transform 0.3s; pointer-events: none; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr" id="mainHdr">
  <div class="hdr-logo">
    <div class="hdr-icon">🎬</div>
    <div><div class="hdr-name">さむね君</div><div class="hdr-sub">BirdFlip 企画ツール</div></div>
  </div>
  <div class="hdr-sep"></div>
  <div class="hdr-spacer"></div>
  <div class="legend">
    <div class="litem"><span class="ldot" style="background:#16a34a"></span>S(5倍+)</div>
    <div class="litem"><span class="ldot" style="background:#22c55e"></span>A(3〜5倍)</div>
    <div class="litem"><span class="ldot" style="background:#3b82f6"></span>B(1〜3倍)</div>
    <div class="litem"><span class="ldot" style="background:#f59e0b"></span>C(3倍未満)</div>
    <div class="litem"><span class="ldot" style="background:#ef4444"></span>×(1年超)</div>
  </div>
</div>

<!-- 共有モード用バー -->
<div class="readonly-bar" id="readonlyBar">
  <div class="hdr-icon">🎬</div>
  <div><div class="readonly-title" id="readonlyTitle">読み込み中…</div><div class="readonly-sub">さむね君 — 企画資料</div></div>
  <span class="readonly-badge">READ ONLY</span>
</div>

<!-- 案件タブバー -->
<div class="case-tabbar" id="caseTabbar" style="display:none">
  <button class="case-tab-add" onclick="addCase()">＋ 案件を追加</button>
  <div class="case-tabbar-right">
    <button class="tab-share-btn" onclick="openShareModal()">🔗 この案件を共有</button>
    <button class="tab-add-row-btn" onclick="addRow()">＋ 企画を追加</button>
  </div>
</div>

<!-- テーブル -->
<div class="sheet-wrap">
  <table class="sheet" id="sheet">
    <colgroup>
      <col style="width:36px"><col style="width:18%">
      <col><col><col><col><col>
    </colgroup>
    <thead><tr>
      <th><div class="th-in" style="justify-content:center">#</div></th>
      <th><div class="th-in plan-h">企画タイトル / 文言</div></th>
      <th><div class="th-in"><span class="th-badge">1</span>参考サムネ</div></th>
      <th><div class="th-in"><span class="th-badge">2</span>参考サムネ</div></th>
      <th><div class="th-in"><span class="th-badge">3</span>参考サムネ</div></th>
      <th><div class="th-in"><span class="th-badge">4</span>参考サムネ</div></th>
      <th><div class="th-in"><span class="th-badge">5</span>参考サムネ</div></th>
    </tr></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- MODAL -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">🔗 この案件を共有</div>
    <div class="modal-sub" id="modalSub"></div>
    <div class="modal-url-wrap">
      <input type="text" class="modal-url" id="modalUrl" readonly>
      <button class="modal-copy" id="modalCopyBtn" onclick="copyUrl()">コピー</button>
    </div>
    <div class="modal-note">✓ このURLを知っている人だけが閲覧できます<br>✓ 閲覧者は編集できません（読み取り専用）</div>
    <button class="modal-close" onclick="closeModal()">閉じる</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
// ══ FIREBASE ══
firebase.initializeApp({
  apiKey: "AIzaSyAjBviZ8Pcg3fX8ti2y3y1nMcBz_Dps7mw",
  authDomain: "birdstraike.firebaseapp.com",
  projectId: "birdstraike",
  storageBucket: "birdstraike.firebasestorage.app",
  messagingSenderId: "177151250196",
  appId: "1:177151250196:web:21aefe5c0a53dcb82b7c01"
});
const db = firebase.firestore();
const YT_KEY = 'AIzaSyC1QpmOcd_xyBzXr4UXvh8XfroMAe8NRJo';

// ══ STATE ══
let rowCount = 0;
const dbt = {}, saveTmr = {};
let isShare = false;
let activeCaseId = null;
let cases = []; // [{id, name}]

// ══ INIT ══
async function init() {
  const params = new URLSearchParams(location.search);
  const caseId = params.get('case');

  if (caseId) {
    // 共有モード
    isShare = true;
    document.getElementById('mainHdr').style.display = 'none';
    document.getElementById('readonlyBar').classList.add('visible');
    await loadShareCase(caseId);
  } else {
    // 通常モード
    document.getElementById('caseTabbar').style.display = 'flex';
    await loadCases();
    if (cases.length === 0) await addCase();
  }
}

// ══ 案件管理 ══
async function loadCases() {
  try {
    const snap = await db.collection('samune_cases').orderBy('order').get();
    for (const doc of snap.docs) {
      addCaseTab(doc.id, doc.data().name || '案件');
    }
    if (cases.length > 0) await switchCase(cases[0].id, false);
  } catch(e) { console.error(e); }
}

async function addCase() {
  const snap = await db.collection('samune_cases').get();
  const name = `案件 ${snap.size + 1}`;
  const ref = await db.collection('samune_cases').add({
    name, order: snap.size,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  addCaseTab(ref.id, name);
  await switchCase(ref.id, true);
}

function addCaseTab(id, name) {
  cases.push({ id, name });
  const tabbar = document.getElementById('caseTabbar');
  const addBtn = tabbar.querySelector('.case-tab-add');
  const btn = document.createElement('button');
  btn.className = 'case-tab';
  btn.id = 'ctab-' + id;
  btn.dataset.caseId = id;
  btn.innerHTML = `<input class="case-tab-name" value="${esc(name)}" onclick="event.stopPropagation()" onchange="renameCase('${id}',this.value)" title="クリックで名前変更"><button class="case-tab-del" onclick="event.stopPropagation();delCase('${id}')" title="削除">✕</button>`;
  btn.addEventListener('click', e => { if(e.target.tagName !== 'INPUT' && e.target.tagName !== 'BUTTON') switchCase(id, true); else if(e.target.tagName !== 'BUTTON') switchCase(id, true); });
  tabbar.insertBefore(btn, addBtn);
}

async function switchCase(id, loadRows) {
  activeCaseId = id;
  document.querySelectorAll('.case-tab').forEach(t => t.classList.toggle('active', t.dataset.caseId === id));
  if (loadRows) await loadCaseRows(id);
}

async function loadCaseRows(caseId) {
  // テーブルをクリア
  document.getElementById('tbody').innerHTML = '';
  rowCount = 0;
  try {
    const snap = await db.collection('samune_plans')
      .where('caseId', '==', caseId)
      .orderBy('order').get();
    if (snap.empty) {
      // 新規案件は3行追加
      await addRow(); await addRow(); await addRow();
    } else {
      for (const doc of snap.docs) {
        const d = doc.data();
        createRow(doc.id, d.planText||'', d.refs||[], false);
      }
    }
  } catch(e) {
    console.error(e);
    await addRow(); await addRow(); await addRow();
  }
}

async function renameCase(id, name) {
  const c = cases.find(c=>c.id===id);
  if (c) c.name = name;
  try { await db.collection('samune_cases').doc(id).update({ name }); } catch(e) {}
}

async function delCase(id) {
  if (cases.length <= 1) { showToast('最低1案件必要です'); return; }
  if (!confirm('この案件を削除しますか？（企画データも削除されます）')) return;
  // 紐付いた企画も削除
  const snap = await db.collection('samune_plans').where('caseId','==',id).get();
  const batch = db.batch();
  snap.docs.forEach(d => batch.delete(d.ref));
  await batch.commit();
  await db.collection('samune_cases').doc(id).delete();
  document.getElementById('ctab-'+id)?.remove();
  cases = cases.filter(c=>c.id!==id);
  if (activeCaseId === id) await switchCase(cases[0].id, true);
  showToast('案件を削除しました');
}

// ══ 行管理 ══
async function addRow() {
  if (isShare) return;
  const snap = await db.collection('samune_plans').where('caseId','==',activeCaseId).get();
  const ref = await db.collection('samune_plans').add({
    planText: '', refs:[{},{},{},{},{}],
    caseId: activeCaseId,
    order: snap.size,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  createRow(ref.id, '', [{},{},{},{},{}], false);
}

function createRow(docId, planText, refs, readOnly) {
  rowCount++;
  const rid = rowCount;
  const tr = document.createElement('tr');
  tr.id = 'row-'+rid;
  tr.dataset.docId = docId;

  const tdNum = document.createElement('td');
  tdNum.className = 'rn'; tdNum.textContent = rid;
  tr.appendChild(tdNum);

  const tdPlan = document.createElement('td');
  tdPlan.className = 'plan-td';
  if (readOnly) {
    tdPlan.innerHTML = `<div style="font-size:12px;font-weight:600;color:var(--hdr2);padding:4px 6px;line-height:1.65">${esc(planText)||'（タイトルなし）'}</div>`;
  } else {
    tdPlan.innerHTML = `
      <textarea class="plan-ta" rows="3" placeholder="企画タイトル・サムネ文言">${esc(planText)}</textarea>
      <div class="plan-actions">
        <button class="del-row-btn" onclick="delRow('${docId}',${rid})" title="削除">✕ 削除</button>
      </div>`;
    tdPlan.querySelector('.plan-ta').addEventListener('input', () => scheduleSave(docId, rid));
  }
  tr.appendChild(tdPlan);

  for (let i = 0; i < 5; i++) {
    const cid = `c${rid}r${i}`;
    const td = document.createElement('td');
    td.className = 'ref-td';
    const ref = (refs && refs[i]) || {};
    if (readOnly) {
      td.innerHTML = `<div id="${cid}-skel" style="display:none"></div><div class="err-box" id="${cid}-err"></div><div class="vc" id="${cid}-card"></div><button class="clear-lnk" id="${cid}-clear" style="display:none"></button>`;
    } else {
      td.innerHTML = `
        <div class="url-row">
          <input class="url-in" id="${cid}-url" type="text" value="${esc(ref.url||'')}" placeholder="YouTube URL を貼り付け"
            onpaste="onPaste(event,'${cid}','${docId}',${i})" oninput="onInput('${cid}','${docId}',${i})">
          <button class="go-btn" onclick="fetchVideo('${cid}','${docId}',${i})">→</button>
        </div>
        <div id="${cid}-skel" style="display:none">
          <div class="skel skel-thumb"></div>
          <div class="skel skel-line" style="width:90%"></div>
          <div class="skel skel-line" style="width:55%"></div>
        </div>
        <div class="err-box" id="${cid}-err"></div>
        <div class="vc" id="${cid}-card"></div>
        <button class="clear-lnk" id="${cid}-clear" onclick="clearCell('${cid}','${docId}',${i})">✕ クリア</button>`;
    }
    tr.appendChild(td);
    if (ref.vid) setTimeout(() => renderCard(cid, ref.vid, ref, readOnly), 50);
  }

  document.getElementById('tbody').appendChild(tr);
  if (!readOnly && !planText) tr.querySelector('.plan-ta')?.focus();
  renum();
}

function renum() {
  document.querySelectorAll('#tbody tr').forEach((r,i) => r.querySelector('.rn').textContent = i+1);
}

function scheduleSave(docId, rid) {
  clearTimeout(saveTmr[docId]);
  saveTmr[docId] = setTimeout(() => saveRow(docId, rid), 1000);
}

async function saveRow(docId, rid) {
  const tr = document.getElementById('row-'+rid); if (!tr) return;
  const planText = tr.querySelector('.plan-ta')?.value || '';
  const refs = [];
  for (let i = 0; i < 5; i++) {
    const cid = `c${rid}r${i}`;
    const card = document.getElementById(cid+'-card');
    refs.push(card?.dataset?.refdata ? JSON.parse(card.dataset.refdata) : { url: document.getElementById(cid+'-url')?.value||'' });
  }
  try { await db.collection('samune_plans').doc(docId).update({ planText, refs }); } catch(e) {}
}

async function delRow(docId, rid) {
  if (!confirm('この企画を削除しますか？')) return;
  await db.collection('samune_plans').doc(docId).delete();
  document.getElementById('row-'+rid)?.remove();
  renum();
  showToast('削除しました');
}

// ══ YouTube ══
function onPaste(e,cid,docId,idx) { setTimeout(()=>fetchVideo(cid,docId,idx),80); }
function onInput(cid,docId,idx) {
  clearTimeout(dbt[cid]);
  dbt[cid] = setTimeout(()=>{ if(document.getElementById(cid+'-url')?.value?.includes('youtu')) fetchVideo(cid,docId,idx); },900);
}
function extractId(url) { const m=url.match(/(?:v=|\/embed\/|\/shorts\/|youtu\.be\/|\/v\/)([a-zA-Z0-9_-]{11})/); return m?m[1]:null; }

async function fetchVideo(cid,docId,idx) {
  const url = document.getElementById(cid+'-url')?.value?.trim()||''; if(!url) return;
  const vid = extractId(url); if(!vid){showErr(cid,'有効なYouTube URLを入力してください');return;}
  setSkel(cid,true); clearErr(cid);
  try {
    const vRes = await fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics,contentDetails&id=${vid}&key=${YT_KEY}`);
    const vData = await vRes.json();
    if(!vData.items?.length){setSkel(cid,false);showErr(cid,'動画が見つかりませんでした');return;}
    const item = vData.items[0];
    const cRes = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${item.snippet.channelId}&key=${YT_KEY}`);
    const cData = await cRes.json();
    const info = {
      url, vid,
      title: item.snippet.title,
      channel: item.snippet.channelTitle,
      views: parseInt(item.statistics.viewCount||0),
      subs: parseInt(cData.items?.[0]?.statistics?.subscriberCount||0),
      uploadDate: item.snippet.publishedAt.slice(0,10),
      duration: parseDur(item.contentDetails?.duration||'PT0S')
    };
    setSkel(cid,false);
    renderCard(cid,vid,info,false);
    const tr = document.querySelector(`[data-doc-id="${docId}"]`);
    if (tr) scheduleSave(docId, parseInt(tr.id.replace('row-','')));
  } catch(e) { setSkel(cid,false); showErr(cid,'取得に失敗しました'); }
}

function parseDur(iso) {
  const m=iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/); if(!m) return '--:--';
  return `${parseInt(m[1]||0)*60+parseInt(m[2]||0)}:${String(parseInt(m[3]||0)).padStart(2,'0')}`;
}

function renderCard(cid,vid,info,readOnly) {
  const sc = calcScore(info);
  const thumb = `https://img.youtube.com/vi/${vid}/mqdefault.jpg`;
  const ytUrl = `https://www.youtube.com/watch?v=${vid}`;
  const rStr = sc.ratio>=1?sc.ratio.toFixed(1)+'倍':(sc.ratio*100).toFixed(0)+'%';
  const rCls = sc.ratio>=5?'great':sc.ratio>=3?'ok':'low';
  const dLabel = sc.days<=30?`${sc.days}日前`:sc.days<=365?`${Math.round(sc.days/30)}ヶ月前`:'1年超';
  const el = document.getElementById(cid+'-card'); if(!el) return;
  el.dataset.refdata = JSON.stringify(info);
  el.innerHTML = `
    <div class="score-badge ${sc.grade}">${sc.label}</div>
    <div class="score-bar-wrap"><div class="score-bar ${sc.grade}" style="width:${Math.min(sc.score*2,100)}%"></div></div>
    <a class="thumb-link" href="${ytUrl}" target="_blank" rel="noopener">
      <img src="${thumb}" alt="">
      <div class="thumb-ov"><div class="thumb-play"></div></div>
      <span class="thumb-dur">${esc(info.duration)}</span>
    </a>
    <div class="v-ch">${esc(info.channel)}</div>
    <div class="v-title">${esc(info.title)}</div>
    <div class="v-stats">
      <div class="v-stat"><span class="v-stat-icon">▶</span><span class="v-stat-val">${fmt(info.views)}</span><span class="v-stat-sub">再生</span></div>
      <div class="v-stat"><span class="v-stat-icon">🔔</span><span class="v-stat-val">${fmt(info.subs)}</span><span class="v-stat-sub">登録者</span></div>
      <div class="v-stat"><span class="v-stat-icon">📅</span><span class="v-stat-val">${dLabel}</span><span class="v-stat-sub">${info.uploadDate}</span></div>
    </div>
    <div class="v-ratio ${rCls}">再生/登録 = ${rStr}</div>`;
  el.classList.add('loaded');
  if(!readOnly) document.getElementById(cid+'-clear')?.classList.add('show');
}

function calcScore(info) {
  const days=(Date.now()-new Date(info.uploadDate))/86400000;
  if(!info.uploadDate||isNaN(days)||days>365) return{grade:'X',label:'× 1年超',score:0,ratio:0,days:9999};
  const ratio=info.subs>0?info.views/info.subs:0;
  const rec=Math.max(0,50-(days/365)*50);
  const rs=ratio>=10?50:ratio>=5?40:ratio>=3?28:ratio>=1?14:4;
  const total=Math.round(rec+rs);
  let grade=ratio>=5?'S':ratio>=3?'A':ratio>=1?'B':'C';
  if(total<20&&grade!=='C') grade='C';
  return{grade,label:`${grade}  ${total}pt`,score:total,ratio,days:Math.round(days)};
}

function setSkel(cid,show) {
  document.getElementById(cid+'-skel').style.display=show?'block':'none';
  if(show){document.getElementById(cid+'-card')?.classList.remove('loaded');document.getElementById(cid+'-clear')?.classList.remove('show');}
}
function showErr(cid,msg){const e=document.getElementById(cid+'-err');if(e){e.textContent=msg;e.classList.add('show');}}
function clearErr(cid){document.getElementById(cid+'-err')?.classList.remove('show');}
function clearCell(cid,docId,idx){
  document.getElementById(cid+'-url').value='';
  const c=document.getElementById(cid+'-card');c.innerHTML='';c.classList.remove('loaded');delete c.dataset.refdata;
  document.getElementById(cid+'-clear')?.classList.remove('show');clearErr(cid);
  const tr=document.querySelector(`[data-doc-id="${docId}"]`);
  if(tr) scheduleSave(docId,parseInt(tr.id.replace('row-','')));
}

// ══ 共有 ══
function openShareModal() {
  if (!activeCaseId) return;
  const c = cases.find(c=>c.id===activeCaseId);
  document.getElementById('modalSub').textContent = `「${c?.name||'案件'}」の企画をまるごと共有`;
  document.getElementById('modalUrl').value = `${location.origin}${location.pathname}?case=${activeCaseId}`;
  document.getElementById('modalCopyBtn').textContent = 'コピー';
  document.getElementById('modalCopyBtn').classList.remove('copied');
  document.getElementById('modalBg').classList.add('open');
}
function closeModal() { document.getElementById('modalBg').classList.remove('open'); }
function copyUrl() {
  navigator.clipboard.writeText(document.getElementById('modalUrl').value).then(()=>{
    const b=document.getElementById('modalCopyBtn');b.textContent='コピー済 ✓';b.classList.add('copied');
    showToast('URLをコピーしました！');
  });
}

// ══ 共有モード読み込み ══
async function loadShareCase(caseId) {
  try {
    const caseDoc = await db.collection('samune_cases').doc(caseId).get();
    const name = caseDoc.exists ? (caseDoc.data().name||'案件') : '企画資料';
    document.getElementById('readonlyTitle').textContent = name;
    document.title = `${name} — さむね君`;

    const snap = await db.collection('samune_plans')
      .where('caseId','==',caseId)
      .orderBy('order').get();

    if (snap.empty) {
      document.getElementById('tbody').innerHTML = '<tr><td colspan="7" style="padding:32px;text-align:center;color:#9ca3af;font-size:12px">企画が登録されていません</td></tr>';
    } else {
      for (const doc of snap.docs) {
        const d = doc.data();
        createRow(doc.id, d.planText||'', d.refs||[], true);
      }
    }
  } catch(e) { showToast('読み込みに失敗しました'); }
}

// ══ UTILS ══
function fmt(n){if(!n&&n!==0)return'—';if(n>=1e8)return(n/1e8).toFixed(1)+'億';if(n>=1e4)return(n/1e4).toFixed(1)+'万';return Number(n).toLocaleString();}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

init();
</script>
