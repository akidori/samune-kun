<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サムネ企画リサーチシート</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

:root {
  --bg: #f0f7f2;
  --white: #ffffff;
  --header-bg: #166534;
  --col-header-bg: #14532d;
  --border: #d1fae5;
  --border-dark: #86efac;
  --accent: #22c55e;
  --muted: #6b7280;
  --muted2: #9ca3af;
  --text: #14532d;
  --cell-bg: #f0fdf4;
  --plan-bg: #dcfce7;
  --url-bg: #f0fdf4;

  --score-a: #16a34a;
  --score-b: #2563eb;
  --score-c: #d97706;
  --score-d: #dc2626;
  --score-x: #9ca3af;

  --col-num: 36px;
  --col-plan: 220px;
  --col-ref: 200px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--text);
  min-height: 100vh;
  font-size: 12px;
}

/* ── HEADER ── */
.app-header {
  background: #15803d;
  padding: 11px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: 0;
  z-index: 200;
  border-bottom: 2px solid #0f4723;
}
.logo {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  color: #14532d;
  letter-spacing: 0.08em;
}
.logo-sub { font-size: 10px; color: #86efac; margin-left: 2px; }
.spacer { flex: 1; }

.score-legend {
  display: flex;
  gap: 10px;
  align-items: center;
}
.legend-item {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  color: rgba(255,255,255,0.6);
  font-family: 'DM Mono', monospace;
}
.legend-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
}

.add-btn {
  background: var(--accent);
  border: none;
  border-radius: 5px;
  padding: 7px 14px;
  font-size: 11px;
  font-weight: 700;
  color: #14532d;
  cursor: pointer;
  font-family: 'Noto Sans JP', sans-serif;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: opacity 0.15s;
}
.add-btn:hover { opacity: 0.85; }

/* ── SHEET WRAPPER ── */
.sheet-outer {
  overflow-x: auto;
  padding: 0;
}
.sheet-outer::-webkit-scrollbar { height: 5px; }
.sheet-outer::-webkit-scrollbar-thumb { background: var(--border-dark); border-radius: 3px; }

/* ── TABLE ── */
.sheet {
  border-collapse: collapse;
  width: 100%;
  min-width: 900px;
  background: var(--white);
  border-top: 1px solid var(--border-dark);
  table-layout: fixed;
}

/* COLUMN HEADERS */
.sheet thead tr th {
  background: var(--col-header-bg);
  border-right: 1px solid rgba(255,255,255,0.08);
  border-bottom: 2px solid #0f4723;
  padding: 0;
  position: sticky;
  top: 44px;
  z-index: 100;
}
.sheet thead tr th:last-child { border-right: none; }

.th-inner {
  padding: 9px 10px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.35);
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}
.th-inner.plan { color: #14532d; }
.th-ref-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  font-size: 9px;
  color: rgba(255,255,255,0.3);
}

/* ROW */
.sheet tbody tr {
  border-bottom: 1px solid var(--border);
}
.sheet tbody tr:last-child { border-bottom: none; }
.sheet tbody tr:hover td { background: #f0fdf4; }
.sheet tbody tr:hover td.plan-cell { background: #dcfce7; }

/* ROW NUM */
td.row-num {
  width: var(--col-num);
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--muted2);
  background: #f0fdf4;
  border-right: 1px solid var(--border-dark);
  vertical-align: top;
  padding-top: 14px;
  user-select: none;
}

/* PLAN CELL */
td.plan-cell {
  width: var(--col-plan);
  background: var(--plan-bg);
  border-right: 2px solid var(--border-dark);
  vertical-align: top;
  padding: 10px;
  position: relative;
}
.plan-textarea {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  font-family: 'Noto Sans JP', sans-serif;
  resize: none;
  line-height: 1.6;
  min-height: 56px;
  padding: 4px 6px;
  border-radius: 4px;
  transition: background 0.15s;
}
.plan-textarea:focus { background: rgba(22,163,74,0.05); }
.plan-textarea::placeholder { color: var(--muted2); font-weight: 300; font-size: 11px; }
.del-row-btn {
  position: absolute;
  top: 6px;
  right: 6px;
  background: none;
  border: none;
  color: var(--muted2);
  cursor: pointer;
  font-size: 12px;
  width: 18px;
  height: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 3px;
  opacity: 0;
  transition: opacity 0.15s, background 0.15s, color 0.15s;
}
.sheet tbody tr:hover .del-row-btn { opacity: 1; }
.del-row-btn:hover { background: #fee2e2; color: #dc2626; }

/* REF CELL */
td.ref-cell {
  width: var(--col-ref);
  vertical-align: top;
  border-right: 1px solid var(--border);
  background: var(--cell-bg);
  padding: 10px;
}
td.ref-cell:last-child { border-right: none; }

/* URL ROW */
.url-row {
  display: flex;
  gap: 4px;
  margin-bottom: 8px;
  align-items: center;
}
.url-input {
  flex: 1;
  background: var(--url-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 8px;
  font-size: 9px;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  outline: none;
  min-width: 0;
  transition: border-color 0.15s, background 0.15s;
}
.url-input:focus { border-color: var(--text); background: #fff; }
.url-input::placeholder { color: var(--muted2); font-family: 'Noto Sans JP', sans-serif; font-size: 9px; }
.go-btn {
  background: #15803d;
  border: none;
  border-radius: 4px;
  width: 22px;
  height: 22px;
  cursor: pointer;
  color: #fff;
  font-size: 10px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: opacity 0.15s;
}
.go-btn:hover { opacity: 0.7; }

/* SCORE BADGE */
.score-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  border-radius: 4px;
  padding: 3px 8px;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  margin-bottom: 8px;
  border: 1px solid currentColor;
}
.score-badge.A { color: var(--score-a); background: #f0fdf4; border-color: #86efac; }
.score-badge.B { color: var(--score-b); background: #eff6ff; border-color: #93c5fd; }
.score-badge.C { color: var(--score-c); background: #fffbeb; border-color: #fcd34d; }
.score-badge.D { color: var(--score-d); background: #fef2f2; border-color: #fca5a5; }
.score-badge.X { color: var(--score-x); background: #f9fafb; border-color: #d1d5db; }
.score-badge.expired { color: #dc2626; background: #fef2f2; border-color: #fca5a5; }

.score-bar-wrap { height: 3px; background: var(--border); border-radius: 2px; margin-bottom: 8px; overflow: hidden; }
.score-bar { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
.score-bar.A { background: var(--score-a); }
.score-bar.B { background: var(--score-b); }
.score-bar.C { background: var(--score-c); }
.score-bar.D { background: var(--score-d); }
.score-bar.X { background: var(--score-x); }

/* THUMB */
.thumb-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  border-radius: 5px;
  overflow: hidden;
  background: #ddd;
  margin-bottom: 7px;
}
.thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb-dur {
  position: absolute;
  bottom: 3px; right: 3px;
  background: rgba(0,0,0,0.82);
  color: #fff;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  padding: 1px 4px;
  border-radius: 2px;
}

/* VIDEO INFO */
.v-channel {
  font-size: 9px;
  color: var(--muted);
  font-family: 'DM Mono', monospace;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-bottom: 3px;
}
.v-title {
  font-size: 11px;
  font-weight: 500;
  line-height: 1.45;
  margin-bottom: 7px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.v-stats { display: flex; flex-direction: column; gap: 3px; }
.v-stat {
  display: flex;
  align-items: center;
  gap: 5px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
}
.v-stat-icon { color: var(--muted2); width: 10px; }
.v-stat-val { color: var(--text); font-weight: 500; }
.v-stat-sub { color: var(--muted2); }
.v-ratio {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  margin-top: 4px;
  padding: 3px 6px;
  border-radius: 3px;
  display: inline-block;
}
.v-ratio.good { background: #f0fdf4; color: var(--score-a); }
.v-ratio.ok   { background: #eff6ff; color: var(--score-b); }
.v-ratio.low  { background: #fef2f2; color: var(--score-d); }

/* SKELETON */
.skel { animation: shimmer 1.1s linear infinite; background: linear-gradient(90deg,#e8e7e2 25%,#f2f1ec 50%,#e8e7e2 75%); background-size: 200% 100%; border-radius: 4px; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.skel-thumb { width:100%; aspect-ratio:16/9; border-radius:5px; margin-bottom:7px; }
.skel-line { height:9px; margin-bottom:4px; }

/* STATES */
.video-card { display: none; }
.video-card.loaded { display: block; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:translateY(0)} }

.err-box {
  font-size: 10px; color: #dc2626;
  background: #fef2f2; padding: 5px 7px;
  border-radius: 4px; display: none; line-height: 1.4;
}
.err-box.show { display: block; }

.clear-lnk {
  font-size: 9px; color: var(--muted2);
  background: none; border: none;
  cursor: pointer; text-decoration: underline;
  font-family: 'Noto Sans JP', sans-serif;
  margin-top: 5px; display: none; padding: 0;
}
.clear-lnk.show { display: block; }
.clear-lnk:hover { color: var(--muted); }
</style>
</head>
<body>

<div class="app-header">
  <div>
    <div class="logo">さむね君 <span class="logo-sub">/ サムネ企画リサーチシート</span></div>
  </div>
  <div class="spacer"></div>
  <div class="score-legend">
    <div class="legend-item"><span class="legend-dot" style="background:var(--score-a)"></span>S (5倍+)</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--score-b)"></span>A (3〜5倍)</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--score-c)"></span>B (1〜3倍)</div>
    <div class="legend-item"><span class="legend-dot" style="background:var(--score-d)"></span>C (3倍未満)</div>
    <div class="legend-item"><span class="legend-dot" style="background:#dc2626"></span>× (1年超)</div>
  </div>
  <button class="add-btn" onclick="addRow()">＋ 企画を追加</button>
</div>

<div class="sheet-outer">
  <table class="sheet" id="sheet">
    <colgroup>
      <col style="width:36px">
      <col style="width:18%">
      <col>
      <col>
      <col>
      <col>
      <col>
    </colgroup>
    <thead>
      <tr>
        <th><div class="th-inner" style="justify-content:center">#</div></th>
        <th><div class="th-inner plan">企画タイトル / 文言</div></th>
        <th><div class="th-inner"><span class="th-ref-num">1</span>参考サムネ</div></th>
        <th><div class="th-inner"><span class="th-ref-num">2</span>参考サムネ</div></th>
        <th><div class="th-inner"><span class="th-ref-num">3</span>参考サムネ</div></th>
        <th><div class="th-inner"><span class="th-ref-num">4</span>参考サムネ</div></th>
        <th><div class="th-inner"><span class="th-ref-num">5</span>参考サムネ</div></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
let rowCount = 0;
const dbt = {};

// ── ADD ROW ──
function addRow() {
  rowCount++;
  const rid = rowCount;
  const tr = document.createElement('tr');
  tr.id = 'row-' + rid;

  // row num
  const tdNum = document.createElement('td');
  tdNum.className = 'row-num';
  tdNum.textContent = rid;
  tr.appendChild(tdNum);

  // plan cell
  const tdPlan = document.createElement('td');
  tdPlan.className = 'plan-cell';
  tdPlan.innerHTML = `
    <button class="del-row-btn" onclick="delRow(${rid})" title="行を削除">✕</button>
    <textarea class="plan-textarea" rows="3" placeholder="企画タイトル・サムネ文言&#10;メモなど自由に入力"></textarea>
  `;
  tr.appendChild(tdPlan);

  // ref cells x5
  for (let i = 1; i <= 5; i++) {
    const cid = `c${rid}r${i}`;
    const td = document.createElement('td');
    td.className = 'ref-cell';
    td.innerHTML = `
      <div class="url-row">
        <input class="url-input" id="${cid}-url" type="text" placeholder="YouTube URL を貼り付け"
          onpaste="onPaste(event,'${cid}')" oninput="onInput('${cid}')">
        <button class="go-btn" onclick="fetchVideo('${cid}')">→</button>
      </div>
      <div id="${cid}-skel" style="display:none">
        <div class="skel skel-thumb"></div>
        <div class="skel skel-line" style="width:90%"></div>
        <div class="skel skel-line" style="width:55%"></div>
      </div>
      <div class="err-box" id="${cid}-err"></div>
      <div class="video-card" id="${cid}-card"></div>
      <button class="clear-lnk" id="${cid}-clear" onclick="clearCell('${cid}')">✕ クリア</button>
    `;
    tr.appendChild(td);
  }

  document.getElementById('tbody').appendChild(tr);
  tr.querySelector('.plan-textarea').focus();
  renum();
}

function delRow(rid) {
  document.getElementById('row-' + rid)?.remove();
  renum();
}

function renum() {
  document.querySelectorAll('#tbody tr').forEach((r, i) => {
    r.querySelector('.row-num').textContent = i + 1;
  });
}

// ── URL INPUT ──
function onPaste(e, cid) { setTimeout(() => fetchVideo(cid), 80); }
function onInput(cid) {
  clearTimeout(dbt[cid]);
  dbt[cid] = setTimeout(() => {
    if (document.getElementById(cid + '-url').value.includes('youtu')) fetchVideo(cid);
  }, 900);
}

function extractId(url) {
  const m = url.match(/(?:v=|\/embed\/|\/shorts\/|youtu\.be\/|\/v\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

// ── FETCH ──
const YT_KEY = 'AIzaSyC1QpmOcd_xyBzXr4UXvh8XfroMAe8NRJo';

async function fetchVideo(cid) {
  const url = document.getElementById(cid + '-url').value.trim();
  if (!url) return;
  const vid = extractId(url);
  if (!vid) { showErr(cid, '有効なYouTube URLを入力してください'); return; }

  setSkel(cid, true);
  clearErr(cid);

  try {
    // 動画情報（タイトル・再生数・投稿日・時間）
    const vRes = await fetch(
      `https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics,contentDetails&id=${vid}&key=${YT_KEY}`
    );
    const vData = await vRes.json();
    if (!vData.items || vData.items.length === 0) {
      setSkel(cid, false);
      showErr(cid, '動画が見つかりませんでした');
      return;
    }
    const item = vData.items[0];
    const snippet = item.snippet;
    const stats = item.statistics;
    const channelId = snippet.channelId;

    // チャンネル登録者数を別途取得
    const cRes = await fetch(
      `https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${channelId}&key=${YT_KEY}`
    );
    const cData = await cRes.json();
    const subs = cData.items?.[0]?.statistics?.subscriberCount || 0;

    // ISO8601の再生時間をM:SS形式に変換
    const dur = item.contentDetails?.duration || 'PT0S';
    const durFmt = parseDuration(dur);

    const info = {
      title:      snippet.title,
      channel:    snippet.channelTitle,
      views:      parseInt(stats.viewCount || 0),
      likes:      parseInt(stats.likeCount || 0),
      subs:       parseInt(subs),
      uploadDate: snippet.publishedAt.slice(0, 10),
      duration:   durFmt
    };

    setSkel(cid, false);
    renderCard(cid, vid, info);
  } catch(e) {
    setSkel(cid, false);
    showErr(cid, '取得に失敗: ' + e.message);
  }
}

function parseDuration(iso) {
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!m) return '--:--';
  const h = parseInt(m[1] || 0);
  const min = parseInt(m[2] || 0);
  const sec = parseInt(m[3] || 0);
  const totalMin = h * 60 + min;
  return `${totalMin}:${String(sec).padStart(2,'0')}`;
}

// ── SCORE ──
function calcScore(info) {
  const now = new Date();
  const upload = new Date(info.uploadDate);
  const daysDiff = (now - upload) / (1000 * 60 * 60 * 24);

  // 1年超は問答無用で失格
  if (daysDiff > 365) return { grade: 'expired', label: '× 1年超', score: 0, ratio: 0, recencyPct: 0 };

  const ratio = info.subs > 0 ? info.views / info.subs : 0;

  // 新しさスコア (0〜50点): 30日以内=50, 365日=0
  const recencyScore = Math.max(0, 50 - (daysDiff / 365) * 50);
  const recencyPct = Math.round((1 - daysDiff / 365) * 100);

  // 比率スコア (0〜50点)
  let ratioScore = 0;
  if (ratio >= 10)     ratioScore = 50;
  else if (ratio >= 5) ratioScore = 40;
  else if (ratio >= 3) ratioScore = 28;
  else if (ratio >= 1) ratioScore = 14;
  else                 ratioScore = 4;

  const total = recencyScore + ratioScore;

  let grade, label;
  if (ratio < 3)      { grade = 'D'; label = 'C'; }
  else if (ratio < 5) { grade = 'B'; label = 'A'; }
  else if (ratio < 10){ grade = 'A'; label = 'S'; }
  else                { grade = 'A'; label = 'S+'; }

  // 総合で下げる場合
  if (total < 20) { grade = 'D'; }
  else if (total < 35) { grade = grade === 'A' ? 'B' : grade; }

  return { grade, label, score: Math.round(total), ratio, recencyPct, daysDiff: Math.round(daysDiff) };
}

// ── RENDER ──
function renderCard(cid, vid, info) {
  const sc = calcScore(info);
  const thumb = `https://img.youtube.com/vi/${vid}/mqdefault.jpg`;

  const ratioFmt = sc.ratio >= 1 ? sc.ratio.toFixed(1) + '倍' : (sc.ratio * 100).toFixed(0) + '%';
  const ratioClass = sc.ratio >= 5 ? 'good' : sc.ratio >= 3 ? 'ok' : 'low';

  let badgeClass = sc.grade === 'expired' ? 'expired' : sc.grade;
  let scorePct = sc.grade === 'expired' ? 0 : sc.score * 2; // 0-100

  const dayLabel = sc.daysDiff <= 30 ? `${sc.daysDiff}日前` :
                   sc.daysDiff <= 365 ? `${Math.round(sc.daysDiff/30)}ヶ月前` : '1年超';

  const el = document.getElementById(cid + '-card');
  el.innerHTML = `
    <div class="score-badge ${badgeClass}">
      ${sc.grade === 'expired' ? '× 対象外' : `${sc.label}  ${sc.score}pt`}
    </div>
    <div class="score-bar-wrap">
      <div class="score-bar ${badgeClass}" style="width:${Math.min(scorePct,100)}%"></div>
    </div>
    <div class="thumb-wrap">
      <img src="${thumb}" alt="" onerror="this.style.display='none'">
      <span class="thumb-dur">${esc(info.duration||'--:--')}</span>
    </div>
    <div class="v-channel">${esc(info.channel)}</div>
    <div class="v-title">${esc(info.title)}</div>
    <div class="v-stats">
      <div class="v-stat">
        <span class="v-stat-icon">▶</span>
        <span class="v-stat-val">${fmt(info.views)}</span>
        <span class="v-stat-sub">再生</span>
      </div>
      <div class="v-stat">
        <span class="v-stat-icon">🔔</span>
        <span class="v-stat-val">${fmt(info.subs)}</span>
        <span class="v-stat-sub">登録者</span>
      </div>
      <div class="v-stat">
        <span class="v-stat-icon">📅</span>
        <span class="v-stat-val">${dayLabel}</span>
        <span class="v-stat-sub">${info.uploadDate||''}</span>
      </div>
    </div>
    <div class="v-ratio ${ratioClass}">再生/登録 = ${ratioFmt}</div>
  `;
  el.classList.add('loaded');
  document.getElementById(cid + '-clear').classList.add('show');
}

// ── UTILS ──
function setSkel(cid, show) {
  document.getElementById(cid + '-skel').style.display = show ? 'block' : 'none';
  if (show) {
    document.getElementById(cid + '-card').classList.remove('loaded');
    document.getElementById(cid + '-clear').classList.remove('show');
  }
}
function showErr(cid, msg) {
  const el = document.getElementById(cid + '-err');
  el.textContent = msg; el.classList.add('show');
}
function clearErr(cid) { document.getElementById(cid + '-err').classList.remove('show'); }
function clearCell(cid) {
  document.getElementById(cid + '-url').value = '';
  document.getElementById(cid + '-card').innerHTML = '';
  document.getElementById(cid + '-card').classList.remove('loaded');
  document.getElementById(cid + '-clear').classList.remove('show');
  clearErr(cid);
}
function fmt(n) {
  if (!n && n !== 0) return '—';
  if (n >= 1e8) return (n/1e8).toFixed(1) + '億';
  if (n >= 1e4) return (n/1e4).toFixed(1) + '万';
  return Number(n).toLocaleString();
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// init
addRow(); addRow(); addRow();
</script>
