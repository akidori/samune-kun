<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>さむね君</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500;700&display=swap');

:root {
  --bg: #f8faf8;
  --white: #ffffff;
  --hdr: #0f4c2a;
  --hdr2: #0a3d22;
  --col-hdr: #0a3d22;
  --green: #16a34a;
  --green-l: #22c55e;
  --green-xl: #4ade80;
  --green-bg: #f0fdf4;
  --green-bg2: #dcfce7;
  --border: #e2f0e6;
  --border2: #bbf7d0;
  --text: #0f172a;
  --text2: #374151;
  --muted: #6b7280;
  --muted2: #9ca3af;
  --cell: #f9fffe;
  --plan-bg: #f0fdf4;
  --radius: 6px;

  --s-s: #15803d; --s-a: #16a34a; --s-b: #2563eb;
  --s-c: #d97706; --s-x: #dc2626;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  font-family: 'Noto Sans JP', sans-serif;
  color: var(--text);
  font-size: 12px;
  min-height: 100vh;
}

/* ══════════════════════════════
   HEADER
══════════════════════════════ */
.hdr {
  background: var(--hdr);
  padding: 0 20px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 300;
  box-shadow: 0 1px 0 rgba(0,0,0,0.2), 0 4px 16px rgba(0,0,0,0.15);
}

.hdr-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
}
.hdr-icon {
  width: 30px; height: 30px;
  background: linear-gradient(135deg, var(--green-l), var(--green));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  flex-shrink: 0;
}
.hdr-name {
  font-family: 'Noto Sans JP', sans-serif;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.02em;
}
.hdr-sub {
  font-size: 10px;
  color: rgba(255,255,255,0.4);
  font-weight: 300;
  letter-spacing: 0.04em;
}

.hdr-sep {
  width: 1px; height: 24px;
  background: rgba(255,255,255,0.1);
  flex-shrink: 0;
}
.hdr-spacer { flex: 1; }

.legend {
  display: flex;
  gap: 10px;
  align-items: center;
  padding: 5px 12px;
  background: rgba(0,0,0,0.2);
  border-radius: 20px;
}
.legend-item {
  display: flex; align-items: center; gap: 4px;
  font-size: 10px;
  color: rgba(255,255,255,0.5);
  font-family: 'DM Mono', monospace;
  white-space: nowrap;
}
.ldot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

.hdr-btn {
  height: 32px;
  padding: 0 14px;
  border-radius: 6px;
  border: none;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
  font-family: 'Noto Sans JP', sans-serif;
  display: flex; align-items: center; gap: 6px;
  transition: all 0.15s;
  flex-shrink: 0;
}
.hdr-btn.add {
  background: var(--green-l);
  color: var(--hdr2);
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
.hdr-btn.add:hover { background: var(--green-xl); }

/* ══════════════════════════════
   SHARE BANNER
══════════════════════════════ */
.share-banner {
  background: linear-gradient(90deg, #065f46, #047857);
  padding: 8px 20px;
  display: none;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: rgba(255,255,255,0.8);
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.share-banner.visible { display: flex; }
.share-banner strong { color: #fff; }

/* ══════════════════════════════
   TABLE
══════════════════════════════ */
.sheet-wrap { overflow-x: auto; }
.sheet-wrap::-webkit-scrollbar { height: 4px; }
.sheet-wrap::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

table.sheet {
  border-collapse: collapse;
  width: 100%;
  min-width: 820px;
  table-layout: fixed;
  background: var(--white);
}

/* Column headers */
table.sheet thead th {
  background: var(--col-hdr);
  border-right: 1px solid rgba(255,255,255,0.06);
  border-bottom: 2px solid rgba(255,255,255,0.08);
  padding: 0;
  position: sticky;
  top: 52px;
  z-index: 200;
}
table.sheet thead th:last-child { border-right: none; }

.th-in {
  padding: 9px 12px;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.3);
  display: flex; align-items: center; gap: 6px;
  white-space: nowrap;
}
.th-in.plan-h { color: var(--green-xl); }
.th-badge {
  display: inline-flex; align-items: center; justify-content: center;
  width: 16px; height: 16px;
  background: rgba(255,255,255,0.08);
  border-radius: 3px;
  font-size: 9px;
  color: rgba(255,255,255,0.3);
}

/* Row */
table.sheet tbody tr { border-bottom: 1px solid var(--border); }
table.sheet tbody tr:last-child { border-bottom: none; }
table.sheet tbody tr:hover td { background: #f6fef8; }
table.sheet tbody tr:hover td.plan-td { background: #e8faf0; }

/* Row num */
td.rn {
  width: 36px;
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--green-l);
  background: var(--green-bg);
  border-right: 1px solid var(--border2);
  vertical-align: top;
  padding-top: 14px;
  user-select: none;
}

/* Plan cell */
td.plan-td {
  background: var(--plan-bg);
  border-right: 2px solid var(--border2);
  vertical-align: top;
  padding: 10px 12px;
  position: relative;
}
.plan-ta {
  width: 100%;
  background: transparent;
  border: none;
  outline: none;
  font-size: 12px;
  font-weight: 600;
  color: var(--hdr2);
  font-family: 'Noto Sans JP', sans-serif;
  resize: none;
  line-height: 1.65;
  min-height: 58px;
  padding: 4px 6px;
  border-radius: 4px;
  transition: background 0.15s;
}
.plan-ta:focus { background: rgba(22,163,74,0.06); }
.plan-ta::placeholder { color: var(--border2); font-weight: 300; font-size: 11px; }

.plan-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 8px;
  opacity: 0;
  transition: opacity 0.15s;
}
table.sheet tbody tr:hover .plan-actions { opacity: 1; }

.share-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 4px 9px;
  background: var(--green-bg2);
  border: 1px solid var(--border2);
  border-radius: 4px;
  font-size: 10px;
  color: var(--green);
  font-weight: 600;
  cursor: pointer;
  font-family: 'Noto Sans JP', sans-serif;
  transition: all 0.15s;
}
.share-btn:hover { background: var(--border2); }

.del-btn {
  width: 22px; height: 22px;
  background: none;
  border: none;
  color: var(--muted2);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  border-radius: 4px;
  font-size: 13px;
  transition: all 0.15s;
  margin-left: auto;
}
.del-btn:hover { background: #fee2e2; color: #dc2626; }

/* Ref cell */
td.ref-td {
  border-right: 1px solid var(--border);
  background: var(--cell);
  vertical-align: top;
  padding: 10px;
}
td.ref-td:last-child { border-right: none; }

/* URL input */
.url-row { display: flex; gap: 4px; margin-bottom: 8px; }
.url-in {
  flex: 1; min-width: 0;
  background: var(--green-bg);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 5px 8px;
  font-size: 9px;
  color: var(--text);
  font-family: 'DM Mono', monospace;
  outline: none;
  transition: all 0.15s;
}
.url-in:focus { border-color: var(--green); background: #fff; box-shadow: 0 0 0 2px rgba(34,197,94,0.1); }
.url-in::placeholder { color: var(--muted2); font-family: 'Noto Sans JP', sans-serif; font-size: 9px; }
.go-btn {
  width: 24px; height: 24px;
  background: var(--green);
  border: none; border-radius: 4px;
  cursor: pointer; color: #fff; font-size: 11px;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.go-btn:hover { background: var(--green-l); }

/* Score badge */
.score-badge {
  display: inline-flex; align-items: center; gap: 4px;
  border-radius: 4px;
  padding: 3px 8px;
  font-family: 'DM Mono', monospace;
  font-size: 10px; font-weight: 600;
  margin-bottom: 6px;
  border: 1px solid transparent;
}
.score-badge.S  { color: var(--s-s); background: #f0fdf4; border-color: #86efac; }
.score-badge.A  { color: var(--s-a); background: #f0fdf4; border-color: #bbf7d0; }
.score-badge.B  { color: var(--s-b); background: #eff6ff; border-color: #93c5fd; }
.score-badge.C  { color: var(--s-c); background: #fffbeb; border-color: #fcd34d; }
.score-badge.X  { color: var(--s-x); background: #fef2f2; border-color: #fca5a5; }

.score-bar-wrap { height: 2px; background: var(--border); border-radius: 1px; margin-bottom: 8px; overflow: hidden; }
.score-bar { height: 100%; border-radius: 1px; transition: width 0.5s ease; }
.score-bar.S,.score-bar.A { background: var(--green); }
.score-bar.B { background: #3b82f6; }
.score-bar.C { background: #f59e0b; }
.score-bar.X { background: #ef4444; }

/* Thumbnail */
.thumb-link {
  display: block;
  position: relative;
  width: 100%;
  aspect-ratio: 16/9;
  border-radius: 5px;
  overflow: hidden;
  background: var(--green-bg2);
  margin-bottom: 7px;
  cursor: pointer;
  text-decoration: none;
}
.thumb-link:hover .thumb-overlay { opacity: 1; }
.thumb-link img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumb-overlay {
  position: absolute; inset: 0;
  background: rgba(0,0,0,0.35);
  display: flex; align-items: center; justify-content: center;
  opacity: 0;
  transition: opacity 0.2s;
}
.thumb-play {
  width: 36px; height: 36px;
  background: rgba(255,255,255,0.9);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
}
.thumb-play::after {
  content: '';
  border-style: solid;
  border-width: 7px 0 7px 14px;
  border-color: transparent transparent transparent #000;
  margin-left: 3px;
}
.thumb-dur {
  position: absolute; bottom: 4px; right: 4px;
  background: rgba(0,0,0,0.8);
  color: #fff;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  padding: 1px 4px;
  border-radius: 2px;
}

/* Video info */
.v-ch {
  font-size: 9px; color: var(--muted);
  font-family: 'DM Mono', monospace;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: 3px;
}
.v-title {
  font-size: 11px; font-weight: 500;
  line-height: 1.45; color: var(--text2);
  margin-bottom: 7px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.v-stats { display: flex; flex-direction: column; gap: 3px; }
.v-stat {
  display: flex; align-items: center; gap: 5px;
  font-family: 'DM Mono', monospace; font-size: 9px;
}
.v-stat-icon { color: var(--green-l); width: 10px; font-size: 10px; }
.v-stat-val { color: var(--text); font-weight: 500; }
.v-stat-sub { color: var(--muted2); }
.v-ratio {
  font-family: 'DM Mono', monospace; font-size: 9px;
  margin-top: 5px; padding: 3px 7px; border-radius: 3px;
  display: inline-block; font-weight: 600;
}
.v-ratio.great { background: #f0fdf4; color: var(--s-s); }
.v-ratio.ok    { background: #dbeafe; color: #1d4ed8; }
.v-ratio.low   { background: #fef2f2; color: #dc2626; }

/* Skeleton */
.skel {
  animation: shimmer 1.1s linear infinite;
  background: linear-gradient(90deg, var(--green-bg2) 25%, #f0fdf4 50%, var(--green-bg2) 75%);
  background-size: 200% 100%;
  border-radius: 4px;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.skel-thumb { width:100%; aspect-ratio:16/9; border-radius:5px; margin-bottom:7px; }
.skel-line { height:9px; margin-bottom:4px; }

.vc { display: none; }
.vc.loaded { display: block; animation: fadeUp 0.2s ease; }
@keyframes fadeUp { from{opacity:0;transform:translateY(4px)} to{opacity:1;transform:translateY(0)} }

.err-box {
  font-size: 10px; color: #dc2626;
  background: #fef2f2; padding: 6px 8px;
  border-radius: 4px; display: none; line-height: 1.5;
}
.err-box.show { display: block; }
.clear-lnk {
  font-size: 9px; color: var(--muted2);
  background: none; border: none;
  cursor: pointer; text-decoration: underline;
  font-family: 'Noto Sans JP', sans-serif;
  margin-top: 5px; display: none; padding: 0;
}
.clear-lnk.show { display: block; }
.clear-lnk:hover { color: var(--muted); }

/* ══════════════════════════════
   SHARE MODAL
══════════════════════════════ */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 500;
  display: none;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(2px);
}
.modal-bg.open { display: flex; }
.modal {
  background: #fff;
  border-radius: 12px;
  padding: 24px;
  width: 440px;
  max-width: 90vw;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.modal-title {
  font-size: 15px; font-weight: 700;
  color: var(--hdr2);
  margin-bottom: 6px;
  display: flex; align-items: center; gap: 8px;
}
.modal-sub { font-size: 11px; color: var(--muted); margin-bottom: 16px; }
.modal-url-wrap { position: relative; margin-bottom: 12px; }
.modal-url {
  width: 100%;
  background: var(--green-bg);
  border: 1px solid var(--border2);
  border-radius: 6px;
  padding: 9px 80px 9px 12px;
  font-size: 11px;
  font-family: 'DM Mono', monospace;
  color: var(--text);
  outline: none;
}
.modal-copy {
  position: absolute; right: 6px; top: 50%;
  transform: translateY(-50%);
  background: var(--green);
  border: none; border-radius: 4px;
  padding: 5px 12px;
  font-size: 11px; font-weight: 700;
  color: #fff; cursor: pointer;
  font-family: 'Noto Sans JP', sans-serif;
  transition: background 0.15s;
}
.modal-copy:hover { background: var(--green-l); }
.modal-copy.copied { background: #059669; }
.modal-note {
  font-size: 10px; color: var(--muted2);
  line-height: 1.6;
  background: #f9fafb;
  border-radius: 6px;
  padding: 8px 10px;
  margin-bottom: 14px;
}
.modal-close {
  width: 100%; padding: 9px;
  background: var(--green-bg2);
  border: 1px solid var(--border2);
  border-radius: 6px;
  color: var(--green);
  font-size: 12px; font-weight: 600;
  cursor: pointer;
  font-family: 'Noto Sans JP', sans-serif;
  transition: background 0.15s;
}
.modal-close:hover { background: var(--border2); }

/* ══════════════════════════════
   TOAST
══════════════════════════════ */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--hdr2);
  color: #fff; font-size: 12px;
  padding: 10px 20px;
  border-radius: 20px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  z-index: 600;
  transition: transform 0.3s ease;
  pointer-events: none;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* ══════════════════════════════
   SHARE VIEW (read-only)
══════════════════════════════ */
.share-view-header {
  background: linear-gradient(135deg, #064e2e, #0f4c2a);
  padding: 20px 24px;
  display: none;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.share-view-header.visible { display: flex; }
.share-view-title {
  font-size: 18px; font-weight: 700;
  color: #fff; letter-spacing: -0.3px;
}
.share-view-sub { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; }
.readonly-badge {
  margin-left: auto;
  background: rgba(255,255,255,0.1);
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 10px;
  color: rgba(255,255,255,0.6);
  font-family: 'DM Mono', monospace;
  letter-spacing: 0.08em;
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr" id="mainHdr">
  <div class="hdr-logo">
    <div class="hdr-icon">🎬</div>
    <div>
      <div class="hdr-name">さむね君</div>
      <div class="hdr-sub">サムネ企画リサーチシート</div>
    </div>
  </div>
  <div class="hdr-sep"></div>
  <div class="hdr-spacer"></div>
  <div class="legend">
    <div class="legend-item"><span class="ldot" style="background:#16a34a"></span>S (5倍+)</div>
    <div class="legend-item"><span class="ldot" style="background:#22c55e"></span>A (3〜5倍)</div>
    <div class="legend-item"><span class="ldot" style="background:#3b82f6"></span>B (1〜3倍)</div>
    <div class="legend-item"><span class="ldot" style="background:#f59e0b"></span>C (3倍未満)</div>
    <div class="legend-item"><span class="ldot" style="background:#ef4444"></span>× 1年超</div>
  </div>
  <div class="hdr-sep"></div>
  <button class="hdr-btn add" onclick="addRow()">
    <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M5.5 1v9M1 5.5h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    企画を追加
  </button>
</div>

<!-- SHARE VIEW HEADER (共有モードのみ表示) -->
<div class="share-view-header" id="shareViewHdr">
  <div class="hdr-icon">🎬</div>
  <div>
    <div class="share-view-title" id="shareViewTitle">さむね君</div>
    <div class="share-view-sub">サムネ企画リサーチシート（共有ビュー）</div>
  </div>
  <span class="readonly-badge">READ ONLY</span>
</div>

<!-- TABLE -->
<div class="sheet-wrap">
  <table class="sheet" id="sheet">
    <colgroup>
      <col style="width:36px">
      <col style="width:18%">
      <col><col><col><col><col>
    </colgroup>
    <thead>
      <tr>
        <th><div class="th-in" style="justify-content:center">#</div></th>
        <th><div class="th-in plan-h">企画タイトル / 文言</div></th>
        <th><div class="th-in"><span class="th-badge">1</span>参考サムネ</div></th>
        <th><div class="th-in"><span class="th-badge">2</span>参考サムネ</div></th>
        <th><div class="th-in"><span class="th-badge">3</span>参考サムネ</div></th>
        <th><div class="th-in"><span class="th-badge">4</span>参考サムネ</div></th>
        <th><div class="th-in"><span class="th-badge">5</span>参考サムネ</div></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<!-- SHARE MODAL -->
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-title">🔗 この企画を共有</div>
    <div class="modal-sub" id="modalSubTitle">企画のURLを共有できます</div>
    <div class="modal-url-wrap">
      <input type="text" class="modal-url" id="modalUrl" readonly>
      <button class="modal-copy" id="modalCopyBtn" onclick="copyShareUrl()">コピー</button>
    </div>
    <div class="modal-note">
      ✓ このURLを知っている人だけが閲覧できます<br>
      ✓ 閲覧者は編集できません（読み取り専用）<br>
      ✓ 他の企画は表示されません
    </div>
    <button class="modal-close" onclick="closeModal()">閉じる</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  storageBucket: "birdstraike.firebasestorage.app",
  messagingSenderId: "177151250196",
  appId: "1:177151250196:web:21aefe5c0a53dcb82b7c01"
};
firebase.initializeApp(fbConfig);
const db = firebase.firestore();
const COL = 'samune_plans';

const YT_KEY = 'AIzaSyC1QpmOcd_xyBzXr4UXvh8XfroMAe8NRJo';

// ══════════════════════════════
// STATE
// ══════════════════════════════
let rowCount = 0;
const dbt = {};
let saveTimers = {};
let isShareMode = false;
let shareRowId = null;

// ══════════════════════════════
// INIT: URL判定
// ══════════════════════════════
async function init() {
  const params = new URLSearchParams(location.search);
  const shareId = params.get('share');

  if (shareId) {
    // 共有モード：該当企画のみ読み込み
    isShareMode = true;
    document.getElementById('mainHdr').style.display = 'none';
    document.getElementById('shareViewHdr').classList.add('visible');
    await loadShareRow(shareId);
  } else {
    // 通常モード：全企画読み込み
    await loadAllRows();
    if (rowCount === 0) {
      addRow(); addRow(); addRow();
    }
  }
}

// ══════════════════════════════
// LOAD ALL
// ══════════════════════════════
async function loadAllRows() {
  try {
    const snap = await db.collection(COL).orderBy('order').get();
    if (snap.empty) return;
    for (const doc of snap.docs) {
      const data = doc.data();
      createRowDOM(doc.id, data.planText || '', data.refs || [], false);
    }
  } catch(e) {
    console.error('load error', e);
    showToast('読み込みに失敗しました');
  }
}

// ══════════════════════════════
// LOAD SHARE ROW
// ══════════════════════════════
async function loadShareRow(id) {
  try {
    const doc = await db.collection(COL).doc(id).get();
    if (!doc.exists) {
      document.getElementById('shareViewTitle').textContent = '企画が見つかりません';
      return;
    }
    const data = doc.data();
    document.getElementById('shareViewTitle').textContent = data.planText || '（タイトルなし）';
    createRowDOM(id, data.planText || '', data.refs || [], true);
  } catch(e) {
    showToast('読み込みに失敗しました');
  }
}

// ══════════════════════════════
// ADD ROW
// ══════════════════════════════
async function addRow() {
  if (isShareMode) return;
  const snap = await db.collection(COL).orderBy('order').get();
  const nextOrder = snap.size;
  const ref = await db.collection(COL).add({
    planText: '',
    refs: [{},{},{},{},{}],
    order: nextOrder,
    createdAt: firebase.firestore.FieldValue.serverTimestamp()
  });
  createRowDOM(ref.id, '', [{},{},{},{},{}], false);
}

// ══════════════════════════════
// CREATE ROW DOM
// ══════════════════════════════
function createRowDOM(docId, planText, refs, readOnly) {
  rowCount++;
  const rid = rowCount;
  const tr = document.createElement('tr');
  tr.id = 'row-' + rid;
  tr.dataset.docId = docId;

  // Row num
  const tdNum = document.createElement('td');
  tdNum.className = 'rn';
  tdNum.textContent = rid;
  tr.appendChild(tdNum);

  // Plan cell
  const tdPlan = document.createElement('td');
  tdPlan.className = 'plan-td';
  if (readOnly) {
    tdPlan.innerHTML = `<div style="font-size:13px;font-weight:600;color:var(--hdr2);line-height:1.6;padding:4px 6px">${esc(planText) || '（タイトルなし）'}</div>`;
  } else {
    tdPlan.innerHTML = `
      <textarea class="plan-ta" rows="3" placeholder="企画タイトル・サムネ文言&#10;メモなど自由に入力">${esc(planText)}</textarea>
      <div class="plan-actions">
        <button class="share-btn" onclick="openShareModal('${docId}', this)">
          <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><circle cx="10" cy="2" r="1.5" stroke="currentColor" stroke-width="1.2"/><circle cx="10" cy="10" r="1.5" stroke="currentColor" stroke-width="1.2"/><circle cx="2" cy="6" r="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M3.5 5.2L8.5 2.8M3.5 6.8L8.5 9.2" stroke="currentColor" stroke-width="1.2"/></svg>
          共有リンク
        </button>
        <button class="del-btn" onclick="delRow('${docId}', ${rid})" title="削除">✕</button>
      </div>
    `;
    // テキスト変更で保存
    const ta = tdPlan.querySelector('.plan-ta');
    ta.addEventListener('input', () => scheduleSave(docId, rid));
  }
  tr.appendChild(tdPlan);

  // Ref cells x5
  for (let i = 0; i < 5; i++) {
    const refData = (refs && refs[i]) ? refs[i] : {};
    const cid = `c${rid}r${i}`;
    const td = document.createElement('td');
    td.className = 'ref-td';

    if (readOnly) {
      td.innerHTML = buildRefCellReadOnly(cid, refData, i);
    } else {
      td.innerHTML = buildRefCell(cid, refData, i, docId);
    }

    // 保存済みデータがあればカード表示
    if (refData.vid) {
      setTimeout(() => renderCard(cid, refData.vid, refData, readOnly), 50);
    }
    tr.appendChild(td);
  }

  document.getElementById('tbody').appendChild(tr);
  renum();

  if (!readOnly && !planText) {
    tr.querySelector('.plan-ta')?.focus();
  }
}

function buildRefCell(cid, refData, idx, docId) {
  return `
    <div class="url-row">
      <input class="url-in" id="${cid}-url" type="text"
        value="${esc(refData.url||'')}"
        placeholder="YouTube URL を貼り付け"
        onpaste="onPaste(event,'${cid}','${docId}',${idx})"
        oninput="onInput('${cid}','${docId}',${idx})">
      <button class="go-btn" onclick="fetchVideo('${cid}','${docId}',${idx})">→</button>
    </div>
    <div id="${cid}-skel" style="display:none">
      <div class="skel skel-thumb"></div>
      <div class="skel skel-line" style="width:90%"></div>
      <div class="skel skel-line" style="width:55%"></div>
    </div>
    <div class="err-box" id="${cid}-err"></div>
    <div class="vc" id="${cid}-card"></div>
    <button class="clear-lnk" id="${cid}-clear" onclick="clearCell('${cid}','${docId}',${idx})">✕ クリア</button>
  `;
}

function buildRefCellReadOnly(cid, refData, idx) {
  return `
    <div id="${cid}-skel" style="display:none"></div>
    <div class="err-box" id="${cid}-err"></div>
    <div class="vc" id="${cid}-card"></div>
    <button class="clear-lnk" id="${cid}-clear" style="display:none"></button>
  `;
}

// ══════════════════════════════
// SAVE
// ══════════════════════════════
function scheduleSave(docId, rid) {
  clearTimeout(saveTimers[docId]);
  saveTimers[docId] = setTimeout(() => saveRow(docId, rid), 1000);
}

async function saveRow(docId, rid) {
  const tr = document.getElementById('row-' + rid);
  if (!tr) return;
  const planText = tr.querySelector('.plan-ta')?.value || '';
  const refs = [];
  for (let i = 0; i < 5; i++) {
    const cid = `c${rid}r${i}`;
    const card = document.getElementById(cid + '-card');
    const urlEl = document.getElementById(cid + '-url');
    refs.push(card?.dataset?.refdata ? JSON.parse(card.dataset.refdata) : { url: urlEl?.value || '' });
  }
  try {
    await db.collection(COL).doc(docId).update({ planText, refs });
  } catch(e) {
    console.error('save error', e);
  }
}

// ══════════════════════════════
// DELETE ROW
// ══════════════════════════════
async function delRow(docId, rid) {
  if (!confirm('この企画を削除しますか？')) return;
  try {
    await db.collection(COL).doc(docId).delete();
    document.getElementById('row-' + rid)?.remove();
    renum();
    showToast('企画を削除しました');
  } catch(e) {
    showToast('削除に失敗しました');
  }
}

function renum() {
  document.querySelectorAll('#tbody tr').forEach((r, i) => {
    r.querySelector('.rn').textContent = i + 1;
  });
}

// ══════════════════════════════
// URL INPUT
// ══════════════════════════════
function onPaste(e, cid, docId, idx) {
  setTimeout(() => fetchVideo(cid, docId, idx), 80);
}
function onInput(cid, docId, idx) {
  clearTimeout(dbt[cid]);
  dbt[cid] = setTimeout(() => {
    const v = document.getElementById(cid + '-url')?.value || '';
    if (v.includes('youtu')) fetchVideo(cid, docId, idx);
  }, 900);
}

function extractId(url) {
  const m = url.match(/(?:v=|\/embed\/|\/shorts\/|youtu\.be\/|\/v\/)([a-zA-Z0-9_-]{11})/);
  return m ? m[1] : null;
}

// ══════════════════════════════
// FETCH YOUTUBE
// ══════════════════════════════
async function fetchVideo(cid, docId, idx) {
  const urlEl = document.getElementById(cid + '-url');
  const url = urlEl?.value?.trim() || '';
  if (!url) return;
  const vid = extractId(url);
  if (!vid) { showErr(cid, '有効なYouTube URLを入力してください'); return; }

  setSkel(cid, true); clearErr(cid);

  try {
    const [vRes, ] = await Promise.all([
      fetch(`https://www.googleapis.com/youtube/v3/videos?part=snippet,statistics,contentDetails&id=${vid}&key=${YT_KEY}`)
    ]);
    const vData = await vRes.json();
    if (!vData.items?.length) { setSkel(cid, false); showErr(cid, '動画が見つかりませんでした'); return; }

    const item = vData.items[0];
    const channelId = item.snippet.channelId;

    const cRes = await fetch(`https://www.googleapis.com/youtube/v3/channels?part=statistics&id=${channelId}&key=${YT_KEY}`);
    const cData = await cRes.json();
    const subs = parseInt(cData.items?.[0]?.statistics?.subscriberCount || 0);

    const info = {
      url,
      vid,
      title:      item.snippet.title,
      channel:    item.snippet.channelTitle,
      views:      parseInt(item.statistics.viewCount || 0),
      subs,
      uploadDate: item.snippet.publishedAt.slice(0, 10),
      duration:   parseDur(item.contentDetails?.duration || 'PT0S')
    };

    setSkel(cid, false);
    renderCard(cid, vid, info, false);

    // Firestoreに保存
    if (docId) {
      const tr = document.querySelector(`[data-doc-id="${docId}"]`);
      if (tr) scheduleSave(docId, parseInt(tr.id.replace('row-', '')));
    }
  } catch(e) {
    setSkel(cid, false);
    showErr(cid, '取得に失敗: ' + e.message);
  }
}

function parseDur(iso) {
  const m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
  if (!m) return '--:--';
  const h = parseInt(m[1]||0), min = parseInt(m[2]||0), sec = parseInt(m[3]||0);
  return `${h*60+min}:${String(sec).padStart(2,'0')}`;
}

// ══════════════════════════════
// RENDER CARD
// ══════════════════════════════
function renderCard(cid, vid, info, readOnly) {
  const sc = calcScore(info);
  const thumb = `https://img.youtube.com/vi/${vid}/mqdefault.jpg`;
  const ytUrl = `https://www.youtube.com/watch?v=${vid}`;
  const ratioStr = sc.ratio >= 1 ? sc.ratio.toFixed(1) + '倍' : (sc.ratio*100).toFixed(0) + '%';
  const ratioClass = sc.ratio >= 5 ? 'great' : sc.ratio >= 3 ? 'ok' : 'low';
  const dayLabel = sc.days <= 30 ? `${sc.days}日前` : sc.days <= 365 ? `${Math.round(sc.days/30)}ヶ月前` : '1年超';
  const barPct = sc.grade === 'X' ? 0 : Math.min(sc.score * 2, 100);

  const el = document.getElementById(cid + '-card');
  if (!el) return;

  el.dataset.refdata = JSON.stringify(info);

  el.innerHTML = `
    <div class="score-badge ${sc.grade}">${sc.label}</div>
    <div class="score-bar-wrap"><div class="score-bar ${sc.grade}" style="width:${barPct}%"></div></div>
    <a class="thumb-link" href="${ytUrl}" target="_blank" rel="noopener">
      <img src="${thumb}" alt="" onerror="this.style.display='none'">
      <div class="thumb-overlay"><div class="thumb-play"></div></div>
      <span class="thumb-dur">${esc(info.duration||'--:--')}</span>
    </a>
    <div class="v-ch">${esc(info.channel)}</div>
    <div class="v-title">${esc(info.title)}</div>
    <div class="v-stats">
      <div class="v-stat"><span class="v-stat-icon">▶</span><span class="v-stat-val">${fmt(info.views)}</span><span class="v-stat-sub">再生</span></div>
      <div class="v-stat"><span class="v-stat-icon">🔔</span><span class="v-stat-val">${fmt(info.subs)}</span><span class="v-stat-sub">登録者</span></div>
      <div class="v-stat"><span class="v-stat-icon">📅</span><span class="v-stat-val">${dayLabel}</span><span class="v-stat-sub">${info.uploadDate||''}</span></div>
    </div>
    <div class="v-ratio ${ratioClass}">再生/登録 = ${ratioStr}</div>
  `;
  el.classList.add('loaded');
  if (!readOnly) document.getElementById(cid + '-clear')?.classList.add('show');
}

// ══════════════════════════════
// SCORE
// ══════════════════════════════
function calcScore(info) {
  const days = (Date.now() - new Date(info.uploadDate)) / 86400000;
  if (!info.uploadDate || isNaN(days) || days > 365)
    return { grade: 'X', label: '× 1年超', score: 0, ratio: 0, days: 9999 };
  const ratio = info.subs > 0 ? info.views / info.subs : 0;
  const recency = Math.max(0, 50 - (days/365)*50);
  const ratioScore = ratio>=10?50 : ratio>=5?40 : ratio>=3?28 : ratio>=1?14 : 4;
  const total = Math.round(recency + ratioScore);
  let grade = ratio>=5?'S' : ratio>=3?'A' : ratio>=1?'B' : 'C';
  if (total < 20 && grade !== 'C') grade = 'C';
  return { grade, label: `${grade}  ${total}pt`, score: total, ratio, days: Math.round(days) };
}

// ══════════════════════════════
// CLEAR CELL
// ══════════════════════════════
function clearCell(cid, docId, idx) {
  const urlEl = document.getElementById(cid + '-url');
  if (urlEl) urlEl.value = '';
  const card = document.getElementById(cid + '-card');
  if (card) { card.innerHTML = ''; card.classList.remove('loaded'); delete card.dataset.refdata; }
  document.getElementById(cid + '-clear')?.classList.remove('show');
  clearErr(cid);
  if (docId) {
    const tr = document.querySelector(`[data-doc-id="${docId}"]`);
    if (tr) scheduleSave(docId, parseInt(tr.id.replace('row-', '')));
  }
}

// ══════════════════════════════
// SHARE MODAL
// ══════════════════════════════
function openShareModal(docId, btn) {
  const tr = btn.closest('tr');
  const planText = tr.querySelector('.plan-ta')?.value || '（タイトルなし）';
  const shareUrl = `${location.origin}${location.pathname}?share=${docId}`;
  document.getElementById('modalSubTitle').textContent = `「${planText.slice(0,20)}${planText.length>20?'…':''}」の共有リンク`;
  document.getElementById('modalUrl').value = shareUrl;
  document.getElementById('modalCopyBtn').textContent = 'コピー';
  document.getElementById('modalCopyBtn').classList.remove('copied');
  document.getElementById('modalBg').classList.add('open');
}
function closeModal() {
  document.getElementById('modalBg').classList.remove('open');
}
function copyShareUrl() {
  const url = document.getElementById('modalUrl').value;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.getElementById('modalCopyBtn');
    btn.textContent = 'コピー済 ✓';
    btn.classList.add('copied');
    showToast('リンクをコピーしました！');
  });
}

// ══════════════════════════════
// UTILS
// ══════════════════════════════
function setSkel(cid, show) {
  const s = document.getElementById(cid + '-skel');
  if (s) s.style.display = show ? 'block' : 'none';
  if (show) {
    document.getElementById(cid + '-card')?.classList.remove('loaded');
    document.getElementById(cid + '-clear')?.classList.remove('show');
  }
}
function showErr(cid, msg) {
  const e = document.getElementById(cid + '-err');
  if (e) { e.textContent = msg; e.classList.add('show'); }
}
function clearErr(cid) { document.getElementById(cid + '-err')?.classList.remove('show'); }
function fmt(n) {
  if (!n && n!==0) return '—';
  if (n>=1e8) return (n/1e8).toFixed(1)+'億';
  if (n>=1e4) return (n/1e4).toFixed(1)+'万';
  return Number(n).toLocaleString();
}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// START
init();
</script>
</body>
</html>
